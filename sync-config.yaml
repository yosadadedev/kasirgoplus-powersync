config:
  edition: 3

# Master data needed by the POS screen syncs first (priority 1) so it shows up
# before the large history tables (default priority 3) finish downloading.
streams:
  categories:
    auto_subscribe: true
    priority: 1
    query: |
      SELECT * FROM categories
      WHERE tenant_id = auth.parameter('tenant_id')
        AND deleted_at IS NULL

  products:
    auto_subscribe: true
    priority: 1
    query: |
      SELECT * FROM products
      WHERE tenant_id = auth.parameter('tenant_id')
        AND deleted_at IS NULL

  # sync_recent_mobile = last 7 days (+ unpaid kasbon for transactions), maintained by a
  # DB trigger and an hourly refresh in the backend (migration 020). Older history is
  # read from the backend API by the app.
  transactions:
    auto_subscribe: true
    query: |
      SELECT * FROM transactions
      WHERE tenant_id = auth.parameter('tenant_id')
        AND deleted_at IS NULL
        AND sync_recent_mobile = true

  expenses:
    auto_subscribe: true
    query: |
      SELECT * FROM expenses
      WHERE tenant_id = auth.parameter('tenant_id')
        AND deleted_at IS NULL
        AND sync_recent_mobile = true

  customers:
    auto_subscribe: true
    priority: 1
    query: |
      SELECT * FROM customers
      WHERE tenant_id = auth.parameter('tenant_id')
        AND deleted_at IS NULL

  discounts:
    auto_subscribe: true
    priority: 1
    query: |
      SELECT * FROM discounts
      WHERE tenant_id = auth.parameter('tenant_id')
        AND deleted_at IS NULL

  stock_movements:
    auto_subscribe: true
    query: |
      SELECT * FROM stock_movements
      WHERE tenant_id = auth.parameter('tenant_id')
        AND deleted_at IS NULL
